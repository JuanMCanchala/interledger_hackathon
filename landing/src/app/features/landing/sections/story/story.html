<section class="story" id="historia" aria-labelledby="story-title" [class.animated]="animated()">
  <div class="wrap stage">
    <div class="narration">
      <h2 id="story-title" class="sr-only">Para quién es MiPlante: la historia de Doña Nelly</h2>
      <ol class="steps" aria-hidden="true">
        @for (chapter of chapters; track chapter.title) {
          <li class="step"></li>
        }
      </ol>
      @for (chapter of chapters; track chapter.title) {
        <article class="chapter">
          <h3 class="chapter-title">{{ chapter.title }}</h3>
          <p class="chapter-text">{{ chapter.text }}</p>
        </article>
      }
    </div>

    <figure class="notebook" aria-label="El cuaderno de Doña Nelly">
      <div class="scene scene-sales">
        <p class="note heading">Ventas de la semana</p>
        @for (day of week; track day.name) {
          <p class="note row"><span>{{ day.name }}</span><span>{{ format(day.sold) }}</span></p>
        }
        <svg class="scribble chart" viewBox="0 0 220 90" aria-hidden="true">
          <path d="M4 60 C 20 40, 30 30, 44 34 S 60 84, 80 80 S 100 10, 124 14 S 140 62, 160 64 S 176 88, 190 86 S 206 40, 216 30" />
        </svg>
        <p class="sticky">¿Y si mañana no vendo nada?</p>
      </div>

      <div class="scene scene-debts">
        <p class="note heading">Le debo a…</p>
        <p class="note row"><span>Don Jorge, gaseosas</span><span>$ 120.000</span></p>
        <p class="note row"><span>Doña Rosa, me prestó</span><span>$ 50.000</span></p>
        <p class="note row circled"><span>Arriendo</span><span>$ 400.000</span></p>
        <p class="note row"><span>¿Y la pensión?</span><span>¿?</span></p>
        <svg class="scribble mess" viewBox="0 0 200 120" aria-hidden="true">
          <path d="M10 20 L 190 100 M 20 100 C 60 60, 120 120, 180 30 M 30 60 c 20 -30, 40 30, 60 0 s 40 30, 60 0" />
        </svg>
        <p class="sticky">¡Pagar el lunes sin falta!</p>
      </div>

      <div class="scene scene-ink" aria-hidden="true">
        <svg class="drop" viewBox="0 0 40 56"><path d="M20 0 C 26 16, 40 28, 40 38 A 20 18 0 0 1 0 38 C 0 28, 14 16, 20 0 Z" /></svg>
        <div class="ink">
          <p class="ink-line">Préstamo «gota a gota»</p>
          <p class="ink-line big">hasta 382 % de interés al año</p>
          <p class="ink-line">Y la deuda no para de crecer.</p>
        </div>
      </div>

      <div class="scene scene-pockets">
        <p class="note heading">Hoy vendí {{ format(sale) }}</p>
        @for (pocket of pockets; track pocket.name; let i = $index) {
          <p class="note row">
            <span><span class="check" aria-hidden="true">✓</span> {{ pocket.name }}</span>
            <span>{{ format(shares[i]) }}</span>
          </p>
        }
        <div class="stamp" aria-hidden="true"><app-logo [wordplay]="true" [settled]="true" /></div>
      </div>
    </figure>
  </div>
</section>
