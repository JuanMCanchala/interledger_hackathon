services:
  db:
    image: postgres:16-alpine
    container_name: miplante-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miplante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miplante}
      POSTGRES_DB: ${POSTGRES_DB:-miplante}
    ports:
      - "5432:5432"
    volumes:
      - miplante_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miplante} -d ${POSTGRES_DB:-miplante}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: miplante-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-miplante}:${POSTGRES_PASSWORD:-miplante}@db:5432/${POSTGRES_DB:-miplante}?schema=public
      OP_CLIENT_WALLET_ADDRESS: ${OP_CLIENT_WALLET_ADDRESS:-https://ilp.interledger-test.dev/tienda-billeticos}
      OP_ALLOWED_WALLET_HOSTS: ${OP_ALLOWED_WALLET_HOSTS:-ilp.interledger-test.dev}
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./prisma:/app/prisma
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: miplante-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_INTERNAL_URL: http://backend:3000
    ports:
      - "3001:3001"
    volumes:
      - ./frontend/src:/app/src

volumes:
  miplante_pgdata:
