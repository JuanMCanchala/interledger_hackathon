<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="dockerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="100%" stop-color="#102542" />
    </linearGradient>
    <linearGradient id="ilpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1423" />
      <stop offset="100%" stop-color="#2d1e3e" />
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="560" rx="16" fill="#090d16" />

  <!-- Title -->
  <text x="40" y="42" fill="#f8fafc" font-size="22" font-weight="700">MiPlante · Arquitectura Contenerizada en Docker + Interledger Open Payments</text>
  <text x="40" y="66" fill="#94a3b8" font-size="13">Todo el ecosistema (Frontend Next.js, Backend NestJS + Prisma ORM y Base de Datos PostgreSQL) orquestado en Docker Desktop</text>

  <!-- Docker Compose Box -->
  <rect x="35" y="88" width="700" height="440" rx="14" fill="url(#dockerBg)" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4" />
  <rect x="52" y="75" width="355" height="26" rx="6" fill="#0284c7" />
  <text x="64" y="93" fill="#ffffff" font-size="12" font-weight="700">🐳 DOCKER DESKTOP · docker-compose.yml (Red Interna)</text>

  <!-- Container 1: Frontend Next.js -->
  <rect x="60" y="125" width="195" height="375" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" />
  <rect x="74" y="140" width="167" height="28" rx="6" fill="#0369a1" />
  <text x="157" y="159" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">📦 Contenedor 1: Frontend</text>
  <text x="157" y="190" fill="#38bdf8" font-size="17" font-weight="700" text-anchor="middle">Next.js</text>
  <text x="157" y="208" fill="#94a3b8" font-size="11" text-anchor="middle">React · App Router · Puerto :3001</text>

  <rect x="76" y="228" width="163" height="48" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="157" y="248" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">/onboard</text>
  <text x="157" y="265" fill="#94a3b8" font-size="10" text-anchor="middle">Registro y Tope Diario (Grant)</text>

  <rect x="76" y="288" width="163" height="48" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="157" y="308" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">/merchant</text>
  <text x="157" y="325" fill="#94a3b8" font-size="10" text-anchor="middle">Caja POS QR + Dashboard</text>

  <rect x="76" y="348" width="163" height="48" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="157" y="368" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">/pay</text>
  <text x="157" y="385" fill="#94a3b8" font-size="10" text-anchor="middle">Checkout Cliente (COP / USD)</text>

  <rect x="76" y="408" width="163" height="48" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="157" y="428" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">/sandbox</text>
  <text x="157" y="445" fill="#94a3b8" font-size="10" text-anchor="middle">Inspector Open Payments</text>

  <!-- Container 2: Backend NestJS + Prisma -->
  <rect x="295" y="125" width="215" height="375" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.8" />
  <rect x="310" y="140" width="185" height="28" rx="6" fill="#be123c" />
  <text x="402" y="159" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">📦 Contenedor 2: Backend</text>
  <text x="402" y="190" fill="#fb7185" font-size="17" font-weight="700" text-anchor="middle">NestJS + Prisma ORM</text>
  <text x="402" y="208" fill="#94a3b8" font-size="11" text-anchor="middle">REST API · Puerto :3000</text>

  <rect x="311" y="228" width="183" height="48" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="402" y="248" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Controllers &amp; Pipes</text>
  <text x="402" y="265" fill="#94a3b8" font-size="10" text-anchor="middle">REST API + Callbacks GNAP</text>

  <rect x="311" y="288" width="183" height="48" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="402" y="308" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Merchants &amp; Sales Services</text>
  <text x="402" y="325" fill="#94a3b8" font-size="10" text-anchor="middle">Allocation Engine (Pure BigInt)</text>

  <rect x="311" y="348" width="183" height="52" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
  <text x="402" y="368" fill="#e9d5ff" font-size="12" font-weight="600" text-anchor="middle">OpenPaymentsModule</text>
  <text x="402" y="385" fill="#c084fc" font-size="10" text-anchor="middle">@interledger/open-payments SDK</text>

  <rect x="311" y="412" width="183" height="48" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2" />
  <text x="402" y="432" fill="#a7f3d0" font-size="12" font-weight="600" text-anchor="middle">PrismaService (ORM)</text>
  <text x="402" y="449" fill="#34d399" font-size="10" text-anchor="middle">$transaction &amp; Row Locks</text>

  <!-- Container 3: PostgreSQL DB -->
  <rect x="548" y="125" width="165" height="375" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.8" />
  <rect x="560" y="140" width="141" height="28" rx="6" fill="#047857" />
  <text x="630" y="159" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">📦 Contenedor 3: DB</text>
  <text x="630" y="190" fill="#34d399" font-size="17" font-weight="700" text-anchor="middle">PostgreSQL 16</text>
  <text x="630" y="208" fill="#94a3b8" font-size="11" text-anchor="middle">Volumen Persistente · :5432</text>

  <rect x="564" y="232" width="133" height="36" rx="5" fill="#0f172a" stroke="#334155" />
  <text x="630" y="255" fill="#e2e8f0" font-size="11" text-anchor="middle">📋 merchants</text>

  <rect x="564" y="278" width="133" height="36" rx="5" fill="#0f172a" stroke="#334155" />
  <text x="630" y="301" fill="#e2e8f0" font-size="11" text-anchor="middle">📋 rules ( % / deudas )</text>

  <rect x="564" y="324" width="133" height="36" rx="5" fill="#0f172a" stroke="#334155" />
  <text x="630" y="347" fill="#e2e8f0" font-size="11" text-anchor="middle">📋 sales &amp; settlements</text>

  <rect x="564" y="370" width="133" height="36" rx="5" fill="#0f172a" stroke="#334155" />
  <text x="630" y="393" fill="#e2e8f0" font-size="11" text-anchor="middle">📋 mandates (Grants)</text>

  <rect x="564" y="416" width="133" height="36" rx="5" fill="#0f172a" stroke="#334155" />
  <text x="630" y="439" fill="#e2e8f0" font-size="11" text-anchor="middle">📋 payments (ILP)</text>

  <!-- External Box: Interledger Testnet Wallets -->
  <rect x="775" y="88" width="290" height="440" rx="14" fill="url(#ilpBg)" stroke="#a855f7" stroke-width="2" />
  <rect x="792" y="75" width="255" height="26" rx="6" fill="#7e22ce" />
  <text x="920" y="93" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">🌐 INTERLEDGER OPEN PAYMENTS</text>

  <text x="920" y="122" fill="#e9d5ff" font-size="12" font-weight="600" text-anchor="middle">6 Wallets Oficiales del Equipo</text>

  <rect x="795" y="138" width="250" height="54" rx="7" fill="#0f172a" stroke="#a855f7" />
  <text x="807" y="158" fill="#f8fafc" font-size="12" font-weight="700">🏪 Tienda Principal (COP)</text>
  <text x="807" y="176" fill="#c084fc" font-size="10">$ilp.interledger-test.dev/tienda-billeticos</text>

  <rect x="795" y="202" width="250" height="54" rx="7" fill="#0f172a" stroke="#38bdf8" />
  <text x="807" y="222" fill="#f8fafc" font-size="12" font-weight="700">🙋‍♂️ Cliente Local (COP)</text>
  <text x="807" y="240" fill="#38bdf8" font-size="10">$ilp.interledger-test.dev/cliente-one</text>

  <rect x="795" y="266" width="250" height="54" rx="7" fill="#0f172a" stroke="#38bdf8" />
  <text x="807" y="286" fill="#f8fafc" font-size="12" font-weight="700">🌎 Cliente Extranjero (USD)</text>
  <text x="807" y="304" fill="#38bdf8" font-size="10">$ilp.interledger-test.dev/extranjero-billeticos</text>

  <rect x="795" y="330" width="250" height="54" rx="7" fill="#0f172a" stroke="#34d399" />
  <text x="807" y="350" fill="#f8fafc" font-size="12" font-weight="700">🚚 Proveedor Insumos (10% COP)</text>
  <text x="807" y="368" fill="#34d399" font-size="10">$ilp.interledger-test.dev/proveedor-billeticos</text>

  <rect x="795" y="394" width="250" height="54" rx="7" fill="#0f172a" stroke="#fbbf24" />
  <text x="807" y="414" fill="#f8fafc" font-size="12" font-weight="700">🛡️ Microcrédito Anti-Gota (10%)</text>
  <text x="807" y="432" fill="#fbbf24" font-size="10">$ilp.interledger-test.dev/microcredito</text>

  <rect x="795" y="458" width="250" height="54" rx="7" fill="#0f172a" stroke="#34d399" />
  <text x="807" y="478" fill="#f8fafc" font-size="12" font-weight="700">🐷 Ahorro Emergencia (5% COP)</text>
  <text x="807" y="496" fill="#34d399" font-size="10">$ilp.interledger-test.dev/ahorro-billeticos</text>

  <!-- Arrows -->
  <line x1="255" y1="252" x2="292" y2="252" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowBlue)" />
  <line x1="510" y1="436" x2="545" y2="436" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrowGreen)" />
  <line x1="510" y1="374" x2="772" y2="374" stroke="#c084fc" stroke-width="2.4" marker-end="url(#arrowPurple)" />
</svg>
