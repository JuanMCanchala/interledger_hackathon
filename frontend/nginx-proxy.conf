# Shared by every proxied location in nginx.conf.template.
# The backend may be another host (Railway gives it its own HTTPS domain), so send its own Host
# and SNI; the backend builds absolute URLs from PUBLIC_BASE_URL, not from these headers.
proxy_set_header Host $proxy_host;
proxy_ssl_server_name on;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_read_timeout 60s;
