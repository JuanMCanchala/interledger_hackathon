<header class="nav" [class.open]="menuOpen()">
  <span class="progress" aria-hidden="true"></span>
  <div class="wrap bar">
    <a class="logo" href="#inicio" aria-label="MiPlante, volver al inicio">
      <app-logo aria-hidden="true" />
    </a>

    <nav id="nav-menu" class="menu" aria-label="Secciones de la página">
      <ul class="links">
        @for (link of links; track link.href) {
          <li>
            <a
              class="link"
              [href]="link.href"
              [attr.aria-current]="link.href === active() ? 'location' : null"
              (click)="menuOpen.set(false)"
            >
              <span class="link-label">{{ link.label }}</span>
              <span class="link-hint">{{ link.hint }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <a class="button magnetic cta" [routerLink]="app.register" (click)="menuOpen.set(false)">Prueba la caja</a>

    <button
      type="button"
      class="toggle"
      aria-controls="nav-menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.update((open) => !open)"
    >
      <span class="sr-only">{{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}</span>
      <span class="toggle-lines" aria-hidden="true"></span>
    </button>
  </div>
</header>
