<section class="purpose" id="proposito" aria-labelledby="purpose-title">
  <app-doodle class="margin-doodle left" name="calculadora" data-speed="0.85" />
  <app-doodle class="margin-doodle right" name="peso" data-speed="1.15" />

  <div class="wrap inner">
    <h2 id="purpose-title" class="title">Por qué existe MiPlante</h2>

    <p class="manifesto">
      @for (segment of manifesto; track $index) {
        @if (isFigure(segment)) {
          <a class="figure" [href]="'#fuente-' + segment.source" data-cursor="Fuente"
            ><span class="figure-value">{{ segment.value }}</span><sup>{{ segment.source }}</sup></a
          >
        } @else {
          <span class="text">{{ segment }}</span>
        }
      }
    </p>

    <ol class="sources" aria-label="Fuentes">
      @for (source of sources; track source.url; let i = $index) {
        <li [id]="'fuente-' + (i + 1)">
          <a [href]="source.url" target="_blank" rel="noopener">{{ source.label }}</a>
        </li>
      }
    </ol>
  </div>
</section>
