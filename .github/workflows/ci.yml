name: CI

on:
  push:
    branches: [dev, qa, main, prod]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: miplante
          POSTGRES_PASSWORD: miplante
          POSTGRES_DB: miplante_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miplante -d miplante_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Runs the storage contract against a real PostgreSQL (tests/prismaStore.test.ts).
      TEST_DATABASE_URL: postgresql://miplante:miplante@localhost:5432/miplante_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
