<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crea tu cuenta · MiPlante</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/miplante.css" />
    <script type="module" src="/js/auth.js"></script>
  </head>
  <body>
    <div class="container">
      <header class="site-header">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 21v-9" />
              <path d="M12 12c0-4 3-7 8-7 0 4-3 7-8 7z" />
              <path d="M12 14c0-3-2.5-5.5-7-5.5 0 3 2.5 5.5 7 5.5z" />
            </svg>
          </span>
          MiPlante
        </a>
        <a class="btn btn-ghost" data-keep-next href="/login">Ya tengo cuenta</a>
      </header>

      <main class="narrow stack">
        <div class="stack-sm">
          <p class="eyebrow">Registro · paso 1 de 3</p>
          <h1 class="h1-sm">Crea tu cuenta</h1>
          <p class="lead">
            Con ella entras a tu caja desde cualquier equipo. Después configuras
            tu tienda y a dónde va cada parte de tus ventas.
          </p>
        </div>

        <form id="auth-form" class="card stack" data-mode="register" novalidate>
          <label class="field">
            <span>Tu nombre</span>
            <input
              id="auth-name"
              required
              maxlength="80"
              autocomplete="name"
              placeholder="Ej: Rosa Martínez"
            />
          </label>
          <label class="field">
            <span>Correo</span>
            <input
              id="auth-email"
              type="email"
              required
              maxlength="200"
              autocomplete="email"
              autocapitalize="off"
              spellcheck="false"
              placeholder="tu@correo.com"
            />
          </label>
          <label class="field">
            <span>Contraseña</span>
            <input
              id="auth-password"
              type="password"
              required
              minlength="8"
              maxlength="200"
              autocomplete="new-password"
            />
            <small class="hint">Al menos 8 caracteres.</small>
          </label>
          <p id="auth-error" class="banner banner-bad" role="alert" hidden></p>
          <button type="submit" class="btn btn-primary btn-lg btn-block" id="auth-submit">
            Crear cuenta y seguir
          </button>
          <p class="small center">
            ¿Ya tienes cuenta? <a data-keep-next href="/login">Entra a tu caja</a>
          </p>
        </form>
      </main>

      <footer class="site-footer">
        <span>Pagos con Open Payments sobre la red Interledger.</span>
        <a href="/sandbox">Sandbox de Open Payments</a>
      </footer>
    </div>
  </body>
</html>
